
#Face of Horror Jumpscare Settings
[jumpscare_timing]
	#Base interval between jumpscares in minutes
	#Range: 1 ~ 60
	defaultIntervalMinutes = 4
	#Interval between jumpscares during full moon in minutes
	#Range: 1 ~ 20
	fullMoonIntervalMinutes = 2
	#Random variation applied to intervals in seconds (+/-)
	#Range: 0 ~ 60
	variationSeconds = 30
	#Time in ticks of the paralysis effect
	#Range: 0 ~ 12000
	effectTimeTicks = 40
	#Whether the interval should increase by 10% each day
	increaseIntervalWithDays = true
	#Whether paralysis effect should be applied to the player
	applyParalysis = true
	#Whether the Spirit of the Harvest Moon event can occur
	HarvestMoonEvent = false
	#Whether ambient sounds should play
	playSounds = false

