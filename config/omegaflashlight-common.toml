#Detailed flashlight shadows (visual only): when on, the beam casts full soft shadows вЂ” entities, particles and weather cast too, colored-glass tint applies, and the shadow edge uses the configured PCF softness. Basic wall occlusion of the beam is ALWAYS on regardless of this setting (with this off, a cheap terrain-only depth map with a hard 1-tap edge still blocks the beam at walls). Default false (occlusion-only).
flashlightShadows = false
#Flashlight beam takes on the color of stained glass it passes through. Requires flashlightShadows.
flashlightColoredGlass = true
#Particles cast approximate shadows from the flashlight (visual only): when on, dense particles (campfire/fire smoke, explosions, etc.) in the beam project soft BLOB shadows onto the surface behind them. Approximate: light-facing occluder quads sized from each particle, capped per source and alpha/size-gated, so expect soft blobs rather than crisp shapes. Requires flashlightShadows. Default true (turn off if the blobs look ugly).
particleShadows = false
#Falling rain/snow casts approximate shadows from the flashlight (visual only): when on, the falling weather curtains (drawn by the vanilla weather renderer, NOT the particle engine) project approximate streak shadows onto the surface behind them. DENSE and EXPENSIVE вЂ” weather covers a whole column grid around the light вЂ” so this is DEFAULT FALSE. Bounded (radius + column cap per source). Requires flashlightShadows.
weatherShadows = false
#Volumetric flashlight beam / god rays (visual only): when on, a full-screen post-process ray-marches the flashlight cone for visible light shafts (stronger in rain/thunder). Default false (off).
volumetricBeam = true
#Enable cosmetic flashlight flicker (rare stutter + nearby-monster nervous flicker). When false the beam is fully steady. Default true.
flashlightFlickerEnabled = true
