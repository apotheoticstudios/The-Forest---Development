#Range: -1.0 ~ 1.0
testLightDx = 0.0
#Range: -1.0 ~ 1.0
testLightDy = 0.0
#Range: -1.0 ~ 1.0
testLightDz = 0.0
#Range: 0 ~ 2
testLightMode = 0
#Charge capacity of the Small Battery (ticks of light at drain 1). Default 2400.
#Range: 1 ~ 1000000
batterySmallCapacity = 2400
#Charge capacity of the Medium Battery. Default 7200.
#Range: 1 ~ 1000000
batteryMediumCapacity = 7200
#Charge capacity of the Large Battery. Default 24000.
#Range: 1 ~ 1000000
batteryLargeCapacity = 24000
#Range/intensity multiplier of the Improved Lamp (tier 2). Default 1.25.
#Range: 1.0 ~ 4.0
bulbImprovedMultiplier = 1.25
#Range/intensity multiplier of the High-Quality Lamp (tier 3). Default 1.6.
#Range: 1.0 ~ 4.0
bulbHighQualityMultiplier = 1.8
#Battery charge consumed per server tick while the flashlight is ON. Default 1.
#Range: 0 ~ 1000
batteryDrainPerTick = 0
#Whether a player is granted a ready-to-use flashlight the FIRST time they ever log into this world (a one-time grant tracked in the player's persistent data, so respawns / relogs never give a second one). The flashlight's contents are set by the starterBatteryCount / starterBatteryTier / starterLampTier options below. Default true.
spawnWithFlashlight = false
#How many batteries the starter flashlight comes pre-loaded with (the flashlight has 2 battery slots). 0 = an empty flashlight (no batteries). Range 0..2. Default 2.
#Range: 0 ~ 2
starterBatteryCount = 2
#Tier of the batteries loaded into the starter flashlight: SMALL, MEDIUM or LARGE. Default MEDIUM.
#Allowed Values: SMALL, MEDIUM, LARGE
starterBatteryTier = "MEDIUM"
#Whether the starter batteries arrive fully charged. When false they arrive empty (charge 0). Default true.
starterBatteryFull = true
#Lamp installed in the starter flashlight: NONE (empty lamp slot), BASIC, IMPROVED or HIGH_QUALITY. A flashlight needs a lamp AND charge to actually emit light. Default BASIC.
#Allowed Values: NONE, BASIC, IMPROVED, HIGH_QUALITY
starterLampTier = "BASIC"
#Visual style of the bottom-left battery-charge HUD overlay shown while holding a flashlight: DEFAULT (the textured battery frame with six segments) or MINIMAL (a thin battery outline with vertical strip segments inside it that light up with charge). Default DEFAULT.
#Allowed Values: DEFAULT, MINIMAL
overlayStyle = "DEFAULT"
#Show the remaining charge as a percentage number near the battery overlay. Default false (off).
overlayShowPercent = false
#Where the charge percentage number is drawn when overlayShowPercent is on: CENTER (centered over the battery indicator) or RIGHT (just to the right of the indicator, vertically centered). Default CENTER.
#Allowed Values: CENTER, RIGHT
overlayPercentPosition = "CENTER"
#Size multiplier of the bottom-left battery-charge HUD overlay. 0.8 = the default size; lower shrinks it, higher enlarges it. Range 0.5..4.0. Default 0.8.
#Range: 0.5 ~ 4.0
overlayScale = 0.5
#DEBUG (colored-glass tint): when true, the flashlight forces a constant strong MAGENTA tint on every lit fragment inside the beam cone (bypassing the glass-detection gates) AND logs the resolved Sodium tint uniform/sampler locations + whether the tint pass drew any sections, ONCE. Use it to isolate the colored-glass break: if the whole lit cone turns magenta the tint READ path (sampling + apply) works and the fault is in the tint WRITE/atlas; if it stays uncolored even with this on, the read path itself never runs (shadows off, patch not applied, or VerityShadowMapOn=0). Requires flashlightShadows. Default false (off) вЂ” purely a diagnostic.
debugTintAtlas = false
#DEBUG (particle shadows): when true, forces LARGE opaque occluder quads at EVERY gathered particle in the beam (bypassing the alpha/size gates) and logs, once per second per source, how many particles were read / passed the cull / were drawn plus the bound atlas FBO id + tile viewport. Use it to tell whether particle shadows are missing because nothing is gathered, everything is culled, or the quads draw but are too small to see. Requires flashlightShadows + particleShadows. Default false (diagnostic only).
debugParticleShadows = false
#Swap how a HELD flashlight is operated. When false (default): the flashlight key toggles the light ON/OFF and right-click opens the battery/lamp menu. When true: right-click toggles the light ON/OFF and the flashlight key opens the menu. A head-worn (helmet-slot) flashlight has no right-click, so with this ON the key still falls back to toggling whenever you are NOT holding a flashlight in your main hand. Default false.
swapFlashlightControls = true
