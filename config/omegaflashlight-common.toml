peek", "anomaly_rephased:a_shadow", "anomaly_rephased:a_spectator", "anomaly_rephased:a_statue", "anomaly_rephased:a_statue_alt", "whos_there:empty_alex", "whos_there:empty_steve", "whos_there:ghost_player", "whos_there:white_eye"]
#Flashlight color warmth: 0 = cool white, 1 = warm/incandescent. Default 0.45.
#Range: 0.0 ~ 1.0
flashlightWarmth = 0.8982843137254901
#Flashlight ndotl fill floor: how much faces angled away from the beam still receive. 0 = full directional falloff, 1 = flat. Default 0.55.
#Range: 0.0 ~ 1.0
flashlightAmbientFloor = 0.1041666666666667
#Flashlight beam origin push FORWARD along the view direction (blocks). Default 0.45.
#Range: 0.0 ~ 1.0
flashlightForwardOffset = 1.0
#Flashlight beam origin vertical offset from the eye (blocks; negative = below eye). Default -0.12.
#Range: -0.5 ~ 0.5
flashlightDownOffset = -0.12
#Handheld dynamic flashlight beam: when on, YOUR OWN held flashlight's beam feels handheld вЂ” it lags slightly behind fast camera turns and eases back, sways subtly with your walk cycle, and swings a bit wider (plus a slight downward tilt) while sprinting, instead of being rigidly locked to the centre of the screen. Only affects your own held light; placed flashlights, the debug test light and other players' flashlights stay static. Default true.
dynamicBeam = false
#Strength multiplier for the dynamic beam sway (scales the camera lag + walk bob + sprint magnitudes together). 0 = fully static (same as turning dynamicBeam off), 1 = default, 2 = double. Tune to taste. Default 1.0.
#Range: 0.0 ~ 2.0
dynamicBeamStrength = 1.5
#Volumetric beam in-scatter strength (brightness of the visible shaft). Default 0.5.
#Range: 0.0 ~ 2.0
volBeamStrength = 0.0
#Volumetric beam density MULTIPLIER applied on top of the weather-driven density. Default 1.0.
#Range: 0.0 ~ 2.0
volBeamDensity = 0.7965686274509802
#Volumetric beam ray-march step count (higher = smoother, costlier). Default 24.
#Range: 8 ~ 192
volBeamSteps = 24
#Volumetric beam internal render scale: the god-ray ray-march is done in an offscreen buffer sized W*scale x H*scale, then bilinearly upscaled and additively composited. Lower = much cheaper on fill-rate-bound (integrated) GPUs; the soft god-ray stays nearly identical. 1.0 = full res (old behaviour), 0.5 = half res, 0.25 = quarter res. Default 0.5.
#Range: 0.25 ~ 1.0
volBeamRenderScale = 0.3
#Volumetric beam soft-clamp factor: lower = brighter/more saturated shaft, higher = dimmer. Default 0.6.
#Range: 0.1 ~ 2.0
volBeamSaturation = 0.6006127450980391
#Flashlight shadow-map resolution (square, per source). Higher = sharper flashlight shadows but more VRAM/GPU cost. Default 2048.
#Range: 1024 ~ 4096
shadowMapRes = 1024
#Flashlight shadow PCF filter quality = number of shadow-atlas taps per fragment: 1 (Hard, cheapest), 4 (Soft) or 9 (Softest). Lower = less shadow-atlas sampling bandwidth -> higher FPS on weak GPUs; the value is normalized to the nearest of {1,4,9}. Default 9 (unchanged shadow softness).
#Range: 1 ~ 9
shadowPcfTaps = 3
#When on, caches static-source terrain shadows so terrain geometry isn't re-rendered every frame (visual-neutral perf win): a static (placed / motionless held) flashlight's expensive terrain depth is rendered once into a terrain-cache atlas and copied each frame, while entities are still rendered fresh every frame so mob shadows stay live. When false, old behaviour (full terrain re-render each frame). Default true.
shadowTerrainCache = true
#How often (game ticks) a static source's cached terrain shadow is refreshed to catch world changes (block place/break in the beam). ~10 ticks = 0.5s. Default 10 (range 1..200).
#Range: 1 ~ 200
shadowTerrainRefreshTicks = 10
#Quality preset that bundles the key performance knobs (shadowMapRes, volBeamSteps, volBeamRenderScale, shadowTerrainRefreshTicks). LOW / MEDIUM / HIGH apply a fixed bundle of those values; CUSTOM uses the individual settings below. Toggles (volumetricBeam, flashlightShadows) are NOT forced by the preset. Default CUSTOM.
#Allowed Values: LOW, MEDIUM, HIGH, CUSTOM
qualityPreset = "HIGH"
#Persisted debug test light: whether the detached test flashlight is currently placed/active.
testLightActive = false
#Range: -3.0E7 ~ 3.0E7
