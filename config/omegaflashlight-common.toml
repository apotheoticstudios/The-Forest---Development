#Flashlight beam reach (blocks) in WIDE focus, before the lamp multiplier. Default 11.
#Range: 4.0 ~ 128.0
rangeWider = 11.0
#Flashlight beam width (outer cone angle, degrees) in NARROW focus. The soft inner cone and the shadow projection FOV scale from this automatically. Default 30.
#Range: 5.0 ~ 90.0
angleNarrow = 35.0
#Flashlight beam width (outer cone angle, degrees) in MEDIUM focus. Default 46.
#Range: 5.0 ~ 90.0
angleWide = 46.0
#Flashlight beam width (outer cone angle, degrees) in WIDE focus. Default 62.
#Range: 5.0 ~ 90.0
angleWider = 62.0
#Maximum number of flashlights active at once (1..1024, default 16). This is the hard simultaneous light-source cap: extra flashlights beyond this are ignored for the frame. Every source within the cap both lights the scene AND casts its own shadow. Config-file only (no in-game control): the value is read once when shaders are built, so it applies on game restart or a resource reload (F3+T); editing it mid-session does nothing until then. The EFFECTIVE cap is auto-clamped down to what the GPU can link (fragment uniform registers, max texture size and a shadow-atlas VRAM budget) and logged once at startup.
#Range: 1 ~ 1024
maxLightSources = 8
#Per-source occlusion culling (visual-neutral perf win): a flashlight whose entire lit cone is provably hidden behind opaque geometry has its shadow, soft-light and beam work skipped for that frame (verified each frame with a GPU occlusion query against the finished scene depth). Frustum culling of off-screen cones is always on regardless of this setting; this toggle only controls the behind-wall test, which carries a one-frame reappearance latency. Disabled automatically under an external shader pack. Default true.
occlusionCulling = true
