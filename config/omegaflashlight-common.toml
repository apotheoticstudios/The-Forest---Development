improvedLampColor = ""
#Default beam/light color of the High-Quality Lamp as a HEX string "RRGGBB" (an optional leading # is allowed, case-insensitive). Used only when that lamp has no dyed color. Empty or invalid = the warmth-based default color (unchanged behaviour).
highQualityLampColor = ""
#Config keys whose controls are LOCKED (greyed out) in the in-game settings screen, so they can only be changed by editing this file. Use the keys exactly as written in this file, e.g. "rangeNarrow", "qualityPreset", "volumetricBeam" (case-insensitive). The special value "all" locks every option (including the reset button). Only affects the GUI вЂ” this file always stays editable. Default empty (nothing locked).
